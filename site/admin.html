<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Admin — Live Classroom</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  html, body { -webkit-tap-highlight-color: transparent; }
</style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">

<!-- ===== Login gate ===== -->
<div id="login" class="min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-sm bg-slate-900 border border-slate-800 rounded-2xl p-6">
    <h1 class="text-xl font-semibold">Admin Login</h1>
    <p class="text-sm text-slate-400 mt-1">Enter the admin secret to continue.</p>
    <input id="login-input" type="password" autocomplete="current-password"
           class="mt-4 w-full px-3 py-2 rounded-lg bg-slate-800 border border-slate-700 focus:outline-none focus:border-emerald-500" />
    <div id="login-err" class="hidden text-rose-400 text-sm mt-2"></div>
    <button id="login-btn"
            class="mt-4 w-full py-2 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white font-medium">
      Continue
    </button>
  </div>
</div>

<!-- ===== Panel ===== -->
<div id="panel" class="hidden min-h-screen flex">
  <aside class="w-64 shrink-0 border-r border-slate-800 bg-slate-950 p-4 flex flex-col">
    <div class="text-lg font-semibold mb-1">Live Classroom</div>
    <div class="text-xs text-slate-500 mb-6">Admin Panel</div>
    <nav class="space-y-1">
      <button data-tab="students"   class="tab-btn w-full text-left px-3 py-2 rounded-lg hover:bg-slate-800">Students</button>
      <button data-tab="curriculum" class="tab-btn w-full text-left px-3 py-2 rounded-lg hover:bg-slate-800">Curriculum</button>
      <button data-tab="broadcast"  class="tab-btn w-full text-left px-3 py-2 rounded-lg hover:bg-slate-800">Broadcast</button>
    </nav>
    <div class="mt-auto text-xs text-slate-500 pt-6">
      Writes commit to GitHub → Pages deploys in ~40–60s.
    </div>
  </aside>

  <main class="flex-1 p-6 overflow-y-auto">

    <!-- ============ Students tab ============ -->
    <section id="tab-students" class="tab-pane">
      <h2 class="text-2xl font-semibold mb-4">Student Access &amp; Payments</h2>

      <div class="grid grid-cols-3 gap-6">
        <div class="col-span-1 bg-slate-900 border border-slate-800 rounded-xl p-4">
          <div class="font-semibold mb-3">New Student</div>
          <form id="form-access" class="space-y-3">
            <div>
              <label class="text-xs text-slate-400">Full name</label>
              <input name="student_name" required maxlength="80"
                     class="mt-1 w-full px-3 py-2 rounded-lg bg-slate-800 border border-slate-700 focus:outline-none focus:border-emerald-500" />
            </div>
            <div>
              <label class="text-xs text-slate-400">WhatsApp number</label>
              <input name="whatsapp_number" required maxlength="30" placeholder="+977-98XXXXXXXX"
                     class="mt-1 w-full px-3 py-2 rounded-lg bg-slate-800 border border-slate-700 focus:outline-none focus:border-emerald-500" />
            </div>
            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="text-xs text-slate-400">Payment method</label>
                <select name="payment_method" required
                        class="mt-1 w-full px-3 py-2 rounded-lg bg-slate-800 border border-slate-700 focus:outline-none focus:border-emerald-500">
                  <option value="eSewa">eSewa</option>
                  <option value="Bank Transfer">Bank Transfer</option>
                  <option value="Cash">Cash</option>
                  <option value="Other">Other</option>
                </select>
              </div>
              <div>
                <label class="text-xs text-slate-400">Amount</label>
                <input name="amount_paid" type="number" min="0" step="1" required
                       class="mt-1 w-full px-3 py-2 rounded-lg bg-slate-800 border border-slate-700 focus:outline-none focus:border-emerald-500" />
              </div>
            </div>
            <div>
              <label class="text-xs text-slate-400">Batch name</label>
              <input name="batch_name" required maxlength="50" placeholder="Batch 4"
                     class="mt-1 w-full px-3 py-2 rounded-lg bg-slate-800 border border-slate-700 focus:outline-none focus:border-emerald-500" />
            </div>
            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="text-xs text-slate-400">Start date</label>
                <input name="start_date" type="date" required
                       class="mt-1 w-full px-3 py-2 rounded-lg bg-slate-800 border border-slate-700 focus:outline-none focus:border-emerald-500" />
              </div>
              <div>
                <label class="text-xs text-slate-400">End date</label>
                <input name="end_date" type="date" required
                       class="mt-1 w-full px-3 py-2 rounded-lg bg-slate-800 border border-slate-700 focus:outline-none focus:border-emerald-500" />
              </div>
            </div>
            <button type="submit"
                    class="w-full py-2 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white font-medium disabled:opacity-50">
              Generate &amp; Approve
            </button>
          </form>
          <div id="key-result" class="hidden mt-4 p-3 rounded-lg bg-emerald-950 border border-emerald-800">
            <div class="text-xs text-emerald-300">New access key</div>
            <div class="flex items-center gap-2 mt-1">
              <code id="key-value" class="text-lg font-mono text-emerald-200 flex-1"></code>
              <button id="key-copy"
                      class="px-2 py-1 rounded bg-emerald-700 hover:bg-emerald-600 text-xs">Copy</button>
            </div>
          </div>
        </div>

        <div class="col-span-2 bg-slate-900 border border-slate-800 rounded-xl p-4">
          <div class="flex items-center justify-between mb-3">
            <div class="font-semibold">All Access Keys</div>
            <button id="refresh-keys"
                    class="text-xs px-2 py-1 rounded bg-slate-800 hover:bg-slate-700">Refresh</button>
          </div>
          <div id="keys-table-wrap" class="overflow-x-auto">
            <table class="w-full text-sm">
              <thead class="text-left text-slate-400 border-b border-slate-800">
                <tr>
                  <th class="py-2 pr-3">Name</th>
                  <th class="py-2 pr-3">Batch</th>
                  <th class="py-2 pr-3">Key</th>
                  <th class="py-2 pr-3">Period</th>
                  <th class="py-2 pr-3">Status</th>
                  <th class="py-2 pr-3"></th>
                </tr>
              </thead>
              <tbody id="keys-tbody"></tbody>
            </table>
          </div>
        </div>
      </div
